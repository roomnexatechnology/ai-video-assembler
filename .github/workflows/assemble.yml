name: Assemble video (free)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job folder under input/jobs/ to assemble"
        required: false
        default: "job1"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-devanagari
          ffmpeg -version | head -1

      - name: Assemble
        run: python3 scripts/assemble.py "${{ inputs.job_id }}"

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ inputs.job_id }}
          path: dist/final.mp4
          retention-days: 7
