name: Assemble video (free)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job folder under input/jobs/ to assemble"
        required: false
        default: "job1"

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          (which ffmpeg || sudo apt-get install -y -qq ffmpeg)
          ffmpeg -version | head -1
          mkdir -p ~/.fonts
          curl -sSL -o ~/.fonts/NotoSansDevanagari.ttf "https://github.com/google/fonts/raw/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwght%5D.ttf"
          fc-cache -f ~/.fonts >/dev/null
          fc-list | grep -i devanagari | head -2

      - name: Assemble
        run: python3 scripts/assemble.py "${{ inputs.job_id }}"

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ inputs.job_id }}
          path: dist/final.mp4
          retention-days: 7
